
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 15th Birthday, Angelina 💜</title>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: white;
  font-family: Georgia, serif;
  background: linear-gradient(145deg, #8f72ad, #c3b6e8 48%, #9b7eb8);
  overflow-x: hidden;
}

.sparkles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.sparkle {
  position: absolute;
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%,100% { opacity: .2; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

.hero {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 35px 18px 75px;
  position: relative;
}

.intro {
  text-align: center;
  margin-bottom: 22px;
  animation: fadeUp 1s both;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .25em;
  font: .72rem Arial, sans-serif;
  margin-bottom: 12px;
}

h1 {
  margin: 0;
  font-size: clamp(2.4rem, 7vw, 5rem);
  font-weight: 500;
  text-shadow: 0 4px 22px #492c6640;
}

.letter-wrap {
  width: min(88vw, 620px);
  position: relative;
  animation: letterPop 1.1s .2s both;
  filter: drop-shadow(0 22px 32px #31194c40);
}

.letter-wrap::before {
  content: "";
  position: absolute;
  inset: 10px -9px -10px 9px;
  z-index: -1;
  background: #ffffff40;
  transform: rotate(1deg);
}

.letter {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid #ffffffa6;
}

.scroll-cue {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  font: .72rem Arial, sans-serif;
  letter-spacing: .16em;
  text-transform: uppercase;
  animation: bob 2s infinite;
}

@keyframes bob {
  0%,100% { margin-bottom: 0; }
  50% { margin-bottom: 7px; }
}

@keyframes letterPop {
  from { opacity: 0; transform: translateY(50px) scale(.92); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.birthday-title {
  min-height: 65svh;
  padding: 90px 18px;
  display: grid;
  place-items: center;
  text-align: center;
}

.title-card {
  max-width: 900px;
  padding: clamp(28px, 6vw, 60px);
  border: 1px solid #ffffff9e;
  border-radius: 28px;
  background: #ffffff20;
  box-shadow: 0 20px 60px #41255924;
  backdrop-filter: blur(7px);
}

.tiny-label {
  font: .75rem Arial, sans-serif;
  letter-spacing: .25em;
  text-transform: uppercase;
}

.birthday-title h2 {
  margin: 14px 0;
  font-weight: 500;
  line-height: 1.05;
  font-size: clamp(2.8rem, 9vw, 6.7rem);
}

.birthday-title p {
  font-size: clamp(1rem, 3vw, 1.4rem);
}

.heart {
  display: inline-block;
  color: #ffdeeb;
  animation: heartbeat 1.5s infinite;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
}

.gallery-section {
  padding: 35px 16px 100px;
}

.photo-frame {
  width: min(100%, 570px);
  margin: 0 auto;
  padding: 10px;
  background: #ffffffc7;
  border-radius: 8px;
  box-shadow: 0 24px 55px #2f1b4640;
  transform: translateY(28px);
  opacity: 0;
  transition: .9s ease;
}

.photo-frame.visible {
  opacity: 1;
  transform: translateY(0);
}

.photos {
  display: block;
  width: 100%;
  height: auto;
}

.closing {
  text-align: center;
  padding: 0 20px 85px;
  font-size: clamp(1.3rem, 4vw, 2.2rem);
}

.closing small {
  display: block;
  margin-top: 12px;
  font: .85rem Arial, sans-serif;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: .8s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div class="sparkles" aria-hidden="true">
  <span class="sparkle" style="left:8%;top:13%;font-size:22px">✦</span>
  <span class="sparkle" style="left:88%;top:22%;font-size:18px;animation-delay:1s">✧</span>
  <span class="sparkle" style="left:15%;top:54%;font-size:16px;animation-delay:2s">✧</span>
  <span class="sparkle" style="left:82%;top:68%;font-size:24px;animation-delay:.5s">✦</span>
  <span class="sparkle" style="left:48%;top:8%;font-size:14px;animation-delay:1.5s">✧</span>
</div>

<main>
  <!-- The letter appears first -->
  <section class="hero">
    <div>
      <header class="intro">
        <div class="eyebrow">A little something for you</div>
        <h1>For Angelina <span class="heart">♥</span></h1>
      </header>

      <div class="letter-wrap">
        <img class="letter" src="angelina-letter.jpg"
             alt="Birthday letter for Angelina">
      </div>
    </div>

    <div class="scroll-cue">
      <span>Scroll down</span>
      <span>⌄</span>
    </div>
  </section>

  <!-- Birthday message between the two images -->
  <section class="birthday-title reveal">
    <div class="title-card">
      <div class="tiny-label">October 14 · A special day</div>
      <h2>Happy 15th<br>Birthday, Angelina!</h2>
      <p>
        Here's to new memories, big dreams, and a year full of happiness.
        <span class="heart">♥</span>
      </p>
    </div>
  </section>

  <!-- Photo collage appears as she scrolls -->
  <section class="gallery-section">
    <div class="photo-frame">
      <img class="photos" src="angelina-photos.jpg"
           alt="Family photos and memories with Angelina">
    </div>
  </section>

  <footer class="closing reveal">
    <div>Love you always, little sis. <span class="heart">♥</span></div>
    <small>— Bruce</small>
  </footer>
</main>

<script>
const items = document.querySelectorAll('.reveal, .photo-frame');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.14 });

items.forEach(item => observer.observe(item));
</script>

</body>
</html>
